<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de préstamos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6a7380;--ac:#0f766e;--bd:#e2e6ea;--rd:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1f26;--tx:#e8ebef;--mu:#98a2b0;--ac:#2dd4bf;--bd:#2a313b;--rd:#f97066}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1f26;--tx:#e8ebef;--mu:#98a2b0;--ac:#2dd4bf;--bd:#2a313b;--rd:#f97066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
main{max-width:760px;margin:auto;padding:12px}
h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g .card{margin:0}
.k{color:var(--mu);font-size:12px}.v{font-size:20px;font-weight:700}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer;width:auto;padding:9px 14px;margin:6px 6px 0 0}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.r{background:transparent;color:var(--rd);border:1px solid var(--rd);padding:5px 9px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:12px 4px;color:var(--mu);font-weight:600;cursor:pointer}nav a.on{color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
.mo td{font-weight:700;background:var(--bg)}.mu{color:var(--mu);font-size:13px}.rd{color:var(--rd)}
.md{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.md>div{background:var(--card);border-radius:12px;padding:14px;max-width:520px;width:100%;max-height:90%;overflow:auto}.md img{max-width:100%}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body><main id="app"></main>
<nav><a id="n-home" onclick="go('home')">Inicio</a><a id="n-loans" onclick="go('loans')">Préstamos</a><a id="n-cfg" onclick="go('cfg')">Configuración</a></nav>
<div id="login" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:50;align-items:center;justify-content:center;padding:16px"><div class="card" style="max-width:340px;width:100%"><h2 style="margin-top:0">Control de préstamos</h2><label>Correo</label><input id="lu" type="email" autocomplete="username"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')entrar()"><div id="le" class="rd mu"></div><button onclick="entrar()">Entrar</button></div></div>
<script src="config.js"></script>
<script>const _ok=window.SB_URL&&window.SB_KEY&&!String(window.SB_URL).includes('PEGA_AQUI')&&!String(window.SB_KEY).includes('PEGA_AQUI');
const _L=()=>document.getElementById('login'),_msg=t=>{const e=document.getElementById('le');if(e)e.textContent=t};
if(_ok){try{window.sb=window.supabase.createClient(window.SB_URL,window.SB_KEY)}catch(e){}}
async function bootStart(){_L().style.display='flex';
if(!window.sb){_msg('Falta configurar config.js (URL y clave de Supabase).');return}
try{const {data:{session}}=await window.sb.auth.getSession();if(!session)return;
let {data,error}=await window.sb.from('prestamos_datos').select('json,version').eq('id',1).maybeSingle();if(error){_msg('Error al cargar: '+error.message);return}
if(!data){const r=await window.sb.from('prestamos_datos').insert({id:1,json:{fondo:0,banks:[],clientes:[],loans:[],ancla:''},version:1}).select('json,version').single();if(r.error){_msg('Esta cuenta no tiene acceso a esta aplicación.');await window.sb.auth.signOut();return}data=r.data}
window.__INIT=data.json;window.__VER=data.version;_L().style.display='none';
const s=document.createElement('script');s.src='app.js';document.body.appendChild(s)}catch(e){_msg('Error: '+e.message)}}
async function entrar(){if(!window.sb)return _msg('Falta configurar config.js');const {error}=await window.sb.auth.signInWithPassword({email:document.getElementById('lu').value.trim(),password:document.getElementById('lp').value});if(error){_msg('Correo o contraseña incorrectos');return}bootStart()}
bootStart();
</script>
</body></html>
